services:
  api:
    build: .
    container_name: dean_office_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - .:/app_code
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BLIND_INDEX_KEY=${BLIND_INDEX_KEY}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
